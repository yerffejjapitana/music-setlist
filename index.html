<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Music Setlist</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="topbar">
    <button id="menu-toggle" aria-label="Open menu">
      <span></span><span></span><span></span>
    </button>
    <span id="topbar-title">Setlist 1</span>
  </div>

  <div id="sidebar-overlay"></div>

  <aside id="sidebar">
    <h2>Setlists</h2>
    <nav id="setlist-nav"></nav>
  </aside>

  <main id="main-content"></main>

  <!-- Settings Modal -->
  <div id="settings-overlay" class="modal-overlay hidden"></div>
  <div id="settings-modal" class="modal hidden">
    <div class="modal-header">
      <h2 id="settings-title">Settings</h2>
      <button id="settings-close" aria-label="Close">✕</button>
    </div>
    <div id="settings-body"></div>
  </div>

  <script src="data.js"></script>
  <script src="transpose.js"></script>
  <script src="app.js"></script>
</body>
</html>
